spring.application.name=skala-qna-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/skala_qna}
spring.datasource.username=${DB_USER:skala}
spring.datasource.password=${DB_PASSWORD:skala_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoints.web.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
management.endpoints.web.cors.allowed-methods=GET
