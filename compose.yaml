services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-skala_qna}
      POSTGRES_USER: ${DB_USER:-skala}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skala_local}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skala} -d ${DB_NAME:-skala_qna}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
